# Laki sound settings for THIS bird (laki-03) - read by laki-receiver.sh at
# every start. Edit, then stop and start the bird. Flags typed by hand still
# override these for one run.
#
# Timbre copied from laki-02. One thing differs: the pitch.

export LAKI_VOLUME=75          # output level % (100 = 0 dB)
export LAKI_PRIME_MS=400       # Zero W v1: 293 ms stall when playback starts, keep more lead
export LAKI_LATENCY=0.3        # PortAudio buffer s
export LAKI_TRAIN_LEVEL=0.08   # min whistle level accepted in training (sender only)

# ---- PITCH: one semitone above laki-01 -------------------------------------
# laki-01 runs on AUTO (its --shift line is commented out), so laki-03 runs on
# auto too and adds one semitone on top. That is what LAKI_SHIFT_OFFSET does.
#
# Writing "--shift 1" instead would NOT be the same thing: giving --shift a
# number switches auto off, so it would mean "one semitone above the WHISTLE",
# not "one semitone above laki-01".
export LAKI_SHIFT_OFFSET=1

FLAGS=""
FLAGS="$FLAGS --birdiness 0.1"   # 0 faithful whistle .. 1 full bird   <- laki-02
FLAGS="$FLAGS --reverb 0.2"      # wet amount 0..1                     <- laki-02
FLAGS="$FLAGS --dry 0.65"        # direct voice 0..1                   <- laki-02
FLAGS="$FLAGS --stages 1"        # reverb passes 1-3
FLAGS="$FLAGS --tail 0.9"        # reverb tail s                       <- laki-02
FLAGS="$FLAGS --texture 0.1"     # bird grain 0..1                     <- laki-02
FLAGS="$FLAGS --bend 0.2"        # per-note bend, semitones            <- laki-02
FLAGS="$FLAGS --hum 1"           # 1 accept hum, 0 whistles only
# NO --shift line here, on purpose: it would turn auto off and LAKI_SHIFT_OFFSET
# would then be counted from your whistle instead of from laki-01.
#
# If you would rather have laki-03 in laki-02's LOW register (an octave down)
# a semitone above it, set LAKI_SHIFT_OFFSET=0 above and uncomment this line:
# FLAGS="$FLAGS --shift -11"     # a semitone above laki-02's -12
