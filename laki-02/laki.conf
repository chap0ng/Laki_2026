# Laki sound settings for THIS bird (laki-02) - read by laki-receiver.sh at
# every start. Edit, then stop and start the bird. Flags typed by hand still
# override these for one run.
#
# This is laki-02's documented voice (recap V3: "voix ronde, shift -12"), with
# ONE change: LAKI_PRIME_MS. laki-02 is now a Zero W v1, not the Zero 2 W it was
# built on in September, and at 200 ms the output crackles on ARMv6 - the first
# playback step stalls ~293 ms while upsampling.

export LAKI_VOLUME=75          # output level % (100 = 0 dB)
export LAKI_PRIME_MS=400       # Zero W v1: was 200 on the Zero 2 W, 400 is mandatory here
export LAKI_LATENCY=0.3        # PortAudio buffer s
export LAKI_TRAIN_LEVEL=0.08   # min whistle level accepted in training (sender only)

FLAGS=""
FLAGS="$FLAGS --birdiness 0.1"   # 0 faithful whistle .. 1 full bird
FLAGS="$FLAGS --reverb 0.2"      # wet amount 0..1
FLAGS="$FLAGS --dry 0.65"        # direct voice 0..1 (below 0.5 smears the melody)
FLAGS="$FLAGS --stages 1"        # reverb passes 1-3
FLAGS="$FLAGS --tail 0.9"        # reverb tail s
FLAGS="$FLAGS --texture 0.1"     # bird grain 0..1
FLAGS="$FLAGS --bend 0.2"        # per-note bend, semitones
FLAGS="$FLAGS --hum 1"           # 1 accept hum, 0 whistles only
FLAGS="$FLAGS --shift -12"       # one octave below the whistle - laki-02's "round" voice
